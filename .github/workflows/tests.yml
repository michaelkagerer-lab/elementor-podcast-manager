name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: tests/bin/lint.sh

  integration:
    name: WordPress + Elementor (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, gd, zip, mbstring, intl
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integration and HTTP tests
        run: SKIP_E2E=1 tests/run-all.sh
      - name: Debug log
        if: failure()
        run: cat /tmp/epm-wp/site/wp-content/debug.log || true

  mariadb:
    name: Races and import on MariaDB 10.11 (PHP 8.4)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: epm_test
          MARIADB_USER: epm
          MARIADB_PASSWORD: epm
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, pdo_mysql, gd, zip, mbstring, intl
          tools: none
      - name: Site on MariaDB
        run: WP_DB=mysql DB_NAME=epm_test DB_USER=epm DB_PASSWORD=epm DB_HOST=127.0.0.1:3306 tests/bin/setup-wp.sh
      - name: Import integration tests
        run: |
          EPM_ALLOW_TEST_SEED=1 /tmp/epm-wp/wp eval-file tests/fixtures/seed.php > /dev/null
          /tmp/epm-wp/wp eval-file tests/integration/import.php
      - name: Race tests (two processes, with the stress run)
        run: STRESS=1 WP_DIR=/tmp/epm-wp tests/concurrency/run.sh
      - name: Debug log
        if: failure()
        run: cat /tmp/epm-wp/site/wp-content/debug.log || true

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd, zip, mbstring, intl
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: All suites
        run: tests/run-all.sh
      - name: Debug log
        if: failure()
        run: cat /tmp/epm-wp/site/wp-content/debug.log || true
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
